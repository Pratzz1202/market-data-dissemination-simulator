services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    ports:
      - "50051:50051"

  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
    depends_on:
      - server
    command: ["/app/mdd_client", "--host", "server:50051", "--subscribe", "BTC-USD", "--subscribe", "ETH-USD", "--depth", "10"]
